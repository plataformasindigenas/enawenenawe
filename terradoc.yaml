project_name: "Enawenê-Nawê"
project_subtitle: "Darakala Kakwali"
site_title: "Enawenê-Nawê"
site_tagline: "Língua, conhecimento e memória"
culture_name: "Enawenê-Nawê"
meta_prefix: "enawenenawe"
locales: ["pt", "en"]
default_locale: "pt"
base_url: "https://enawenenawe.terradoc.org"

modules:
  dictionary: { enabled: true }
  encyclopedia: { enabled: true }
  fauna: { enabled: true }
  ethnobotany: { enabled: true }
  bibliography: { enabled: true }
  recordings: { enabled: false }
  corpus: { enabled: true }
  videos: { enabled: false }

module_labels:
  dictionary: "Dicionário"
  encyclopedia: "Enciclopédia"
  fauna: "Fauna"
  ethnobotany: "Etnobotânica"
  bibliography: "Bibliografia"
  corpus: "Corpus"

# Código ISO 639-3 da língua (atributo lang no texto na língua).
language_code: unk

# Pesquisa no dicionário (versão 2): letras que contam como a mesma, porque a escrita varia
# (l/r, w/b; u e o), veja CULTURA.md. Acentos nunca contam.
search_folds: {r: l, b: w, u: o}

theme:
  # Versão 2 dos modelos (precisa do terradoc 0.20 ou mais novo). As cores têm papéis e o
  # nome do material de onde vêm (CULTURA.md).
  templates: v2
  pack: enawene
  palette:
    ground: {color: "#FAF3E8", material: "fibra de buriti, algodão"}
    ink: {color: "#2C1810"}
    primary: {color: "#A83220", material: "urucum (ahete)"}
    fill: {color: "#D4A81E", material: "urucum amarelo, penas da tapiragem"}
    muted: {color: "#6B5E4F"}
  hero_people: false
  hero_credit: ""
  hero_alt: "Palmeiras na beira do rio"
  favicon: "images/favicon.svg"
  hero_image: "images/ethnobotany.jpg"  # v2: paisagem, sem pessoas (D25)

# O alfabeto do dicionário (letras e ordem), proposto em 2026-11-18 a partir de fontes
# publicadas; veja CULTURA.md. As vogais nasais ficam junto da vogal simples.
alphabet: [a, d, e, h, i, k, l, m, n, ñ, o, r, s, t, w, x, y]
